
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodePen.io Homepage Replica</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="main-header">
    <nav class="navbar">
      <div class="logo">
        <img src="codepen-logo.png" alt="CodePen Logo">
      </div>
      <ul class="nav-links">
        <li><a href="#">Pens</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Posts</a></li>
        <li><a href="#">Collections</a></li>
        <li class="dropdown-link">
          <a href="#">Spark <span class="chevron">&#x25BE;</span></a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero-section">
      <div class="hero-content">
        <h1>El mejor lugar para construir, probar y descubrir código front-end.</h1>
        <p>CodePen es un entorno de desarrollo social para desarrolladores front-end y diseñadores.</p>
        <div class="hero-actions">
          <a href="#" class="button button-primary">¡Regístrate Gratis!</a>
          <a href="#" class="button button-secondary">Empezar a Codificar</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
